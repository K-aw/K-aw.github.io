<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>互动展厅地图</title>
  <!-- 引入外部样式表 -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-content">
    <!-- 标题行：包含标题和按钮 -->
    <div class="title-row">
      <h1>互动展厅地图</h1>
      <button id="shareBtn" class="share-button">分享</button>
    </div>

    <p class="page-intro">点击图中的 1 到 10 区域进入对应页面。</p>

    <div class="map-wrapper">
      <div class="canvas-container">
        <!-- 这里的 canvas 会覆盖在图片上 -->
        <canvas id="floorplan" width="900" height="640">
          <img src="img/平面绘制图.jpg" alt="展厅平面图">
        </canvas>
      </div>

    <div id="qrcodeModal" class="qrcode-modal hidden" aria-hidden="true">
        <div class="modal-content">
            <!-- 标题和关闭按钮保持不变 -->
            <h3>扫码分享给朋友</h3>
            <button id="qrcodeClose">&times;</button>
            
            <!-- ⚠️ 注意这里：改用 canvas 标签，并设置好宽高 -->
            <canvas id="qrcodeCanvas" width="200" height="200"></canvas>
            
            <p class="qr-tip">打开手机相机扫一扫</p>
        </div>
    </div>

    <div class="legend">
      <h2>展区说明</h2>
      <ol>
        <li>接待室</li>
        <li>第一展区：战略部署</li>
        <li>第二展区：进驻宋庄</li>
        <li>第三展区：解放天津</li>
        <li>老物件陈列</li>
        <li>多功能影音室</li>
        <li>第四展区：战和博弈</li>
        <li>第五展区：保护古都</li>
        <li>第六展区：北平解放</li>
        <li>文创商店</li>
      </ol>
    </div>
  </main>

  <!-- 引入二维码库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <!-- 引入主逻辑脚本 -->
  <script src="script.js"></script>
</body>
</html>
